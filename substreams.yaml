specVersion: v0.1.0
package:
  name: solana_transfers
  version: v0.1.0
  doc: Extracts SOL and SPL token transfers (from, to, amount) from Solana blocks.

network: solana-mainnet-beta

protobuf:
  files:
    - transfers.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/solana_transfers.wasm

modules:
  - name: map_transfers
    kind: map
    initialBlock: 385870151
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:transfers.v1.Transfers
